# ═══════════════════════════════════════════════════════════════════════════════
#  Noteo — Host Nginx config
#  Place at: /etc/nginx/sites-available/noteo
#  Enable:   ln -s /etc/nginx/sites-available/noteo /etc/nginx/sites-enabled/noteo
# ═══════════════════════════════════════════════════════════════════════════════

# ─── HTTP → HTTPS redirect (both domains) ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name noteo.online www.noteo.online api.noteo.online;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend: noteo.online ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noteo.online www.noteo.online;

    # SSL (filled in by certbot)
    ssl_certificate     /etc/letsencrypt/live/noteo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noteo.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # www → non-www
    if ($host = www.noteo.online) {
        return 301 https://noteo.online$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ─── Backend API: api.noteo.online ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.noteo.online;

    # SSL (filled in by certbot — same cert covers api.noteo.online)
    ssl_certificate     /etc/letsencrypt/live/noteo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noteo.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Limit request size (API only, no file uploads)
    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
